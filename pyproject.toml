[project]
name = "wordle"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Yusuf Bayraktar", email = "yusufbayraktar2006@outlook.com" }
]
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.8.0",
    "pyinstaller>=6.0.0",
]

[project.scripts]
wordle = "wordle.__main__:main"

[build-system]
requires = ["uv_build>=0.12.2,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
